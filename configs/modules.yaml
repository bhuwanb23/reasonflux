# Phase 11F — ASFT v0.1 implementation registry.
#
# Machine-readable companion to docs/02_design/implementation_blueprint.md.
# Read by tests/test_spec_module_registry.py and
# tests/test_spec_claim_traceability.py. Not loaded by src/ at runtime.
#
# status semantics (must match disk reality, not the aspiration checklist):
#   implemented — public entry points exist and import
#   partial     — core libraries exist, but at least one entry point is a stub
# Every `partial` module must own at least one entry in `stubs:`.

version: 1
phase: "11F"
target: "ASFT v0.1"

layers:
  1: Experience
  2: Invariant
  3: Skill
  4: Capability
  5: Evaluation

modules:
  # ---------------------------------------------------------------- Layer 1
  - id: M01
    name: Task System
    layer: 1
    phase: A
    contribution: foundation
    status: implemented
    paths: [src/core/task.py, datasets/synthetic, datasets/arc]
    symbols:
      - {module: core.task, name: Task}
    metrics: [TFD]
    experiments: []
    claim: "Tasks are temporary learning stimuli grouped by family; they are not stored intelligence."
    notes: "Task family/difficulty/metadata + synthetic dataset folders exist. ARC folder is a placeholder."

  - id: M02
    name: Reasoning Trace System
    layer: 1
    phase: A
    contribution: foundation
    status: partial
    paths: [src/core/trace.py, src/traces/normalizer.py, src/traces/segmentation.py, src/traces/logger.py, src/pipelines/trace_pipeline.py]
    symbols:
      - {module: core.trace, name: ReasoningTrace}
      - {module: traces.normalizer, name: normalize_traces}
      - {module: traces.segmentation, name: segment_traces}
    metrics: [TC]
    experiments: []
    claim: "The reasoning process, not just input/output, is the learnable asset."
    notes: "Trace model, normalizer, and segmentation are real; TraceLogger and the trace pipeline are stubs."

  - id: M03
    name: Experience Memory
    layer: 1
    phase: A
    contribution: foundation
    status: partial
    paths: [src/core/memory.py, src/traces/trace_store.py]
    symbols:
      - {module: core.memory, name: ExperienceMemory}
    metrics: []
    experiments: []
    claim: "Historical experiences are retrievable by task, trace, and family."
    notes: "In-memory ExperienceMemory works; durable TraceStore persistence is a stub."

  # ---------------------------------------------------------------- Layer 2
  - id: M04
    name: Trace Mining Engine
    layer: 2
    phase: B
    contribution: IDT
    status: partial
    paths: [src/invariants/pattern_mining.py, src/invariants/candidate_generation.py, src/invariants/detector.py, src/traces/trace_similarity.py, src/invariants/cluster.py]
