      - {module: invariants.candidate_generation, name: generate_candidates}
      - {module: invariants.detector, name: TraceMiner}
      - {module: traces.trace_similarity, name: trace_similarity}
      - {module: invariants.cluster, name: cluster_traces}
    metrics: [IER]
    experiments: [exp01_invariants]
    claim: "Recurring reasoning structures can be mined from traces without supervision."
    notes: "Seven-stage mining pipeline plus trace similarity (Jaccard + ordering) and greedy clustering."

  - id: M05
    name: Invariant Discovery Engine
    layer: 2
    phase: B
    contribution: IDT
    status: implemented
    paths: [src/invariants/validation/frequency.py, src/invariants/validation/consistency.py, src/invariants/validation/generality.py, src/invariants/validator.py, src/invariants/sct_priors.py, src/pipelines/invariant_pipeline.py]
    symbols:
      - {module: invariants.validator, name: validate_and_rank}
