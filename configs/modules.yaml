      - {module: invariants.sct_priors, name: attach_sct_priors}
      - {module: pipelines.invariant_pipeline, name: run_invariant_pipeline}
    metrics: [IS, VST]
    experiments: [exp01_invariants]
    claim: "Frequency, consistency, and generality separate real invariants from frequent noise."
    notes: "Validation, trace-derived SCT priors, and the traces→promotable pipeline are implemented."

  - id: M06
