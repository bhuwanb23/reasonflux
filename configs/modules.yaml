# Phase 11F — ASFT v0.1 implementation registry.
#
# Machine-readable companion to docs/02_design/implementation_blueprint.md.
# Read by tests/test_spec_module_registry.py and
# tests/test_spec_claim_traceability.py. Not loaded by src/ at runtime.
#
# status semantics (must match disk reality, not the aspiration checklist):
#   implemented — public entry points exist, import, and are covered by tests
#   partial     — core libraries exist, but at least one entry point is a stub
#   stub        — nothing real yet
# `stubs` is empty and every module is `implemented` as of Phase 11 completion.
# The spec tests assert BOTH that this list is empty AND that no file under src/
# contains NotImplementedError, so the registry cannot drift from the code.

version: 1
phase: "11F"
target: "ASFT v0.1"

layers:
  1: Experience
  2: Invariant
  3: Skill
  4: Capability
  5: Evaluation

modules:
  # ---------------------------------------------------------------- Layer 1
  - id: M01
    name: Task System
    layer: 1
    phase: A
    contribution: foundation
    status: implemented
    paths: [src/core/task.py, src/solver/tasks.py, datasets/synthetic, datasets/arc]
    symbols:
      - {module: core.task, name: Task}
      - {module: solver.tasks, name: make_task}
      - {module: solver.tasks, name: make_task_batch}
    metrics: [TFD]
    experiments: [exp01_invariants]
    claim: "Tasks are temporary learning stimuli grouped by family; they are not stored intelligence."
    notes: "Deterministic grid task generator covers reflection, rotation, counting, grouping. ARC folder remains a placeholder."

  - id: M02
    name: Reasoning Trace System
    layer: 1
    phase: A
    contribution: foundation
    status: implemented
    paths: [src/core/trace.py, src/solver/executor.py, src/traces/logger.py, src/traces/normalizer.py, src/traces/segmentation.py, src/pipelines/trace_pipeline.py]
    symbols:
      - {module: solver.executor, name: GridSolver}
      - {module: traces.logger, name: TraceLogger}
      - {module: traces.normalizer, name: normalize_traces}
      - {module: traces.segmentation, name: segment_traces}
      - {module: pipelines.trace_pipeline, name: run_trace_pipeline}
    metrics: [TC]
    experiments: [exp01_invariants]
    claim: "The reasoning process, not just input/output, is the learnable asset."
    notes: "GridSolver emits ReasoningStep sequences; TraceLogger captures them; the pipeline produces and persists batches."

  - id: M03
    name: Experience Memory
    layer: 1
    phase: A
    contribution: foundation
    status: implemented
    paths: [src/core/memory.py, src/traces/trace_store.py]
    symbols:
      - {module: core.memory, name: ExperienceMemory}
      - {module: traces.trace_store, name: TraceStore}
    metrics: [TC]
    experiments: [exp01_invariants]
    claim: "Historical experiences are retrievable by task, trace, and family."
    notes: "JSON-per-trace persistence with save/load/list_by_family/load_all and a round-trip test."

  # ---------------------------------------------------------------- Layer 2
  - id: M04
    name: Trace Mining Engine
    layer: 2
    phase: B
    contribution: IDT
    status: implemented
    paths: [src/invariants/pattern_mining.py, src/invariants/candidate_generation.py, src/invariants/detector.py, src/traces/trace_similarity.py, src/invariants/cluster.py]
    symbols:
