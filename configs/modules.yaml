stubs: []

# Research claims → modules → metrics → experiments → paper artifact.
# Layer 1 has no standalone claim: it is the instrument every claim depends on.
contributions:
  - id: FOUNDATION
    claim: "Reliable reasoning traces are the precondition for every downstream claim."
    modules: [M01, M02, M03]
    metrics: [TC, TFD]
    experiments: [exp01_invariants]
    paper_artifact: "table: dataset and trace inventory per task family"
  - id: IDT
    claim: "Transferable knowledge emerges from invariants."
    modules: [M04, M05, M06, M07]
    metrics: [IS, VST, IER, TC]
    experiments: [exp01_invariants]
    paper_artifact: "table: invariant inventory vs IS; figure: IS distribution by task family"
  - id: SCT
    claim: "Skills should emerge only when economically justified."
    modules: [M08, M09, M10, M11, M12, M13, M14]
    metrics: [SCV, SU, ASU, PU, NTB]
    experiments: [exp02_skills]
    paper_artifact: "table: SCV decision outcomes; figure: SU distribution before/after promotion"
  - id: transfer
    claim: "Solving task A measurably improves task B through shared structure."
    modules: [T1]
    metrics: [TS, ITS, TU, NTR]
    experiments: [exp03_transfer]
    paper_artifact: "table: TS/ITS per source-target family pair; figure: transfer graph"
  - id: CGM
    claim: "Intelligence growth can be measured through capability growth."
    modules: [M15, M16, M17, M18, M19]
    metrics: [CGR, IG, AG, UG, PU]
    experiments: [exp04_growth]
    paper_artifact: "figure: C_t and IG trajectories; table: CGR by phase with CI"
  - id: ASFT
    claim: "The full pipeline beats baselines and degrades under ablation."
    modules: [M20, M21, M22, M23]
    metrics: [CGR, IG, SU, TS]
    experiments: [exp05_end_to_end]
    paper_artifact: "table: ASFT vs baselines A–D; table: ablations A1–A5"

# MVP success gates. Each verifier must exist under tests/ and contain the named
# test. `status: blocked` would additionally require a live stub as `blocker`.
gates:
  - id: FOUNDATION
    metric: TC
    criterion: "Tasks produce persisted reasoning traces retrievable by task and family, from a real solver."
    scope: end_to_end
    verifier: "tests/test_pipeline_phases.py::test_trace_pipeline_produces_and_persists"
    status: demonstrated
  - id: IDT
    metric: IS
    criterion: "Reflection and rotation invariants are discovered from solver traces and ranked by IS."
    scope: end_to_end
    verifier: "tests/test_experiments.py::test_exp01_discovers_reflection_and_rotation"
    status: demonstrated
  - id: SCT
    metric: SCV
    criterion: "The SCV gate admits justified skills and admits none at a prohibitive threshold."
    scope: end_to_end
    verifier: "tests/test_experiments.py::test_exp02_scv_gate_actually_gates"
    status: demonstrated
  - id: TRANSFER
    metric: TS
    criterion: "Reuse produces credited transfer including cross-family transfer, and never credits incorrect runs."
    scope: end_to_end
    verifier: "tests/test_experiments.py::test_exp03_reports_positive_and_cross_family_transfer"
    status: demonstrated
  - id: CGM
    metric: CGR
    criterion: "Positive, zero, and negative CGR/IG are computed from a capability series."
    scope: harness
    verifier: "tests/test_cgr_e2e.py::test_positive_zero_negative_cgr_and_ig"
    status: demonstrated
  - id: EVALUATION
    metric: CGR
    criterion: "A single end-to-end ASFT run yields positive CGR and IG from solver traces, and beats every baseline."
    scope: end_to_end
    verifier: "tests/test_full_pipeline_e2e.py::test_pipeline_success_flag"
    status: demonstrated

non_goals:
