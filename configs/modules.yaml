    metrics: [IS, VST]
    experiments: [exp01_invariants]
    claim: "Frequency, consistency, and generality separate real invariants from frequent noise."
    notes: "Validation + scoring implemented; the invariants→ranked invariants pipeline entry point is a stub."

  - id: M06
