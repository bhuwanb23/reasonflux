# Entry points that still raise NotImplementedError. `module` says who owns the
# work; `blocks` says which gate it unblocks.
stubs:
  - {path: src/traces/logger.py, symbol: TraceLogger.log, module: M02, blocks: "Phase A trace capture"}
  - {path: src/pipelines/trace_pipeline.py, symbol: run_trace_pipeline, module: M02, blocks: "Phase A trace capture"}
  - {path: src/traces/trace_store.py, symbol: TraceStore.save, module: M03, blocks: "durable experience memory"}
  - {path: src/traces/trace_store.py, symbol: TraceStore.load, module: M03, blocks: "durable experience memory"}
  - {path: src/traces/trace_similarity.py, symbol: trace_similarity, module: M04, blocks: "trace deduplication"}
  - {path: src/invariants/cluster.py, symbol: cluster_traces, module: M04, blocks: "trace clustering"}
  - {path: src/pipelines/invariant_pipeline.py, symbol: run_invariant_pipeline, module: M05, blocks: "Phase B pipeline"}
  - {path: src/pipelines/skill_pipeline.py, symbol: run_skill_pipeline, module: M10, blocks: "Phase C pipeline"}
  - {path: src/transfer/reuse_engine.py, symbol: ReuseEngine.apply, module: T1, blocks: "Phase D skill reuse"}
  - {path: src/evaluation/invariant_metrics.py, symbol: compute_is, module: M19, blocks: "IS reporting"}
  - {path: src/pipelines/full_asft_pipeline.py, symbol: run_full_asft_pipeline, module: M20, blocks: "Phase F end-to-end evidence"}
  - {path: src/utils/visualization.py, symbol: plot_metric, module: M23, blocks: "paper figures"}
  - {path: src/utils/logging.py, symbol: get_logger, module: M23, blocks: "shared logging"}
  # M21 is partial because the standalone baseline packages are declarations
  # only; no registry symbol lives there yet, so it has no NotImplementedError.
  - {path: baselines/no_learning/__init__.py, symbol: "docstring-only package", module: M21, blocks: "standalone baseline implementations", kind: declaration}

# Research claims → modules → metrics → experiments → paper artifact.
# Layer 1 has no standalone claim: it is the instrument every claim depends on,
# so it is registered as `foundation` and must still own metrics/experiments.
contributions:
  - id: FOUNDATION
    claim: "Reliable reasoning traces are the precondition for every downstream claim."
    modules: [M01, M02, M03]
    metrics: [TC, TFD]
    experiments: [exp01_invariants]
    paper_artifact: "table: dataset and trace inventory per task family"
  - id: IDT
    claim: "Transferable knowledge emerges from invariants."
    modules: [M04, M05, M06, M07]
    metrics: [IS, VST, IER, TC]
    experiments: [exp01_invariants]
    paper_artifact: "table: invariant inventory vs IS; figure: IS distribution by task family"
  - id: SCT
    claim: "Skills should emerge only when economically justified."
    modules: [M08, M09, M10, M11, M12, M13, M14]
    metrics: [SCV, SU, ASU, PU, NTB]
    experiments: [exp02_skills]
    paper_artifact: "table: SCV decision outcomes; figure: SU distribution before/after promotion"
  - id: transfer
    claim: "Solving task A measurably improves task B through shared structure."
    modules: [T1]
    metrics: [TS, ITS, TU, NTR]
    experiments: [exp03_transfer]
    paper_artifact: "table: TS/ITS per source-target family pair; figure: transfer graph"
  - id: CGM
    claim: "Intelligence growth can be measured through capability growth."
    modules: [M15, M16, M17, M18, M19]
    metrics: [CGR, IG, AG, UG, PU]
    experiments: [exp04_growth]
    paper_artifact: "figure: C_t and IG trajectories; table: CGR by phase with CI"
  - id: ASFT
    claim: "The full pipeline beats baselines and degrades under ablation."
    modules: [M20, M21, M22, M23]
    metrics: [CGR, IG, SU, TS]
    experiments: [exp05_end_to_end]
    paper_artifact: "table: ASFT vs baselines A–D; table: ablations A1–A5"

# MVP success gates. `status: blocked` requires a `blocker` file that still
# contains NotImplementedError; `demonstrated` requires the verifier test to exist.
gates:
  - id: FOUNDATION
    metric: TC
    criterion: "Tasks produce persisted reasoning traces retrievable by task and family."
    scope: end_to_end
    verifier: "tests/test_spec_module_registry.py::test_partial_modules_own_a_stub"
    status: blocked
    blocker: src/traces/logger.py
    note: "TraceLogger and run_trace_pipeline are stubs, so no real experience is produced yet."
  - id: IDT
    metric: IS
    criterion: "Reflection and rotation invariants are discovered from synthetic traces above the IS floor."
    scope: synthetic
    verifier: "tests/test_trace_miner.py::test_end_to_end_reflection_and_rotation_emerge"
    status: demonstrated
  - id: SCT
    metric: SCV
    criterion: "A reflection skill is promoted while a low-value candidate is rejected; the skill is then reused."
    scope: synthetic
    verifier: "tests/test_skill_pipeline_e2e.py::test_reflection_promoted_verify_rejected"
    status: demonstrated
  - id: TRANSFER
    metric: TS
    criterion: "Transfer-aware ranking prefers an invariant with positive ITS over a higher-frequency zero-transfer one."
    scope: synthetic
    verifier: "tests/test_transfer_aware_ranking.py::test_high_its_outranks_zero_transfer_despite_lower_frequency"
    status: demonstrated
  - id: CGM
    metric: CGR
    criterion: "Positive, zero, and negative CGR/IG are computed from a capability series."
    scope: harness
    verifier: "tests/test_cgr_e2e.py::test_positive_zero_negative_cgr_and_ig"
    status: demonstrated
  - id: EVALUATION
    metric: CGR
    criterion: "A growth run passes the hard gate while the flat baseline fails it, end to end from a single ASFT entry point."
    scope: end_to_end
    verifier: "tests/test_cap_robustness_e2e.py::test_growth_passes_hard_gate"
    status: blocked
    blocker: src/pipelines/full_asft_pipeline.py
    note: "Harness-level gating is demonstrated on synthetic scenarios; the single end-to-end entry point is still a stub, so no paper-facing evidence run exists yet."

non_goals:
  - LLM planner
  - Autonomous agent
  - Meta-reasoner
  - World model
  - Recursive self-improvement
  - Concept graph engine
  - Neural skill embeddings
  - ARC leaderboard optimizer
  - Multi-agent architecture
  - AGI framework
