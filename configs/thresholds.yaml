# Decision thresholds (Phase 7 / 11A examples)
invariants:
  # IS = frequency × consistency × generality; keep patterns at/above this
  minimum_invariant_strength: 5.0
  # Phase 11C-1 qualification policy
  min_frequency: 3
  min_consistency: 0.6
  min_task_families: 2
  min_generality: 0.0
  require_transfer_evidence: true
  min_transfer_events: 1
  # Rejection: structures this broad are treated as universal noise
  universal_noise_generality: 0.95
  # Confidence bands
  moderate_score: 0.4
  strong_score: 0.7

skills:
  # Create skill when SCV = Reuse × AG × TS − CreationCost exceeds this
  skill_creation_threshold: 0.0
  # Alternate stricter threshold used in some Phase 11A examples
  skill_creation_threshold_strict: 2.0

traces:
  min_steps: 1

mining:
  # Phase 11C-2 trace mining constraints
  min_frequency: 3
  min_cross_trace: 2
  max_fragment_length: 4
  min_core_length: 2
  successful_trace_bias: true

validation:
  # Phase 11C-3 ranking / promotion
  freq_norm: 10
  transfer_norm: 3
  min_f: 0.3
  min_c: 0.6
  min_g: 0.3
  min_t: 0.1
  min_r: 0.1
  min_invariant_score: 0.01
  transfer_rescue_min_t: 0.7
  transfer_rescue_min_frequency: 2

transfer:
  # Phase 11C-4 transfer-aware discovery / promotion gate
  min_transfer_attempts: 2
  min_its: 0.5
  ntr_limit: 0.3
  tu_reduction_norm: 1.0
  confidence_attempts_norm: 5
