# Decision thresholds (Phase 7 / 11A examples)
invariants:
  # IS = frequency × consistency × generality; keep patterns at/above this
  minimum_invariant_strength: 5.0
  # Phase 11C-1 qualification policy
  min_frequency: 3
  min_consistency: 0.6
  min_task_families: 2
  min_generality: 0.0
  require_transfer_evidence: true
  min_transfer_events: 1
  # Rejection: structures this broad are treated as universal noise
  universal_noise_generality: 0.95
  # Confidence bands
  moderate_score: 0.4
  strong_score: 0.7

skills:
  # Phase 11D-1 SCT — create when SCV = Reuse × AG × TS − CreationCost exceeds this
  skill_creation_threshold: 0.0
  skill_creation_threshold_strict: 2.0
  min_its: 0.5
  min_evidence: 3
  ntr_limit: 0.3
  similarity_merge: 0.85
  default_creation_cost: 0.1
  min_frequency: 3
  min_consistency: 0.6
  min_generality: 0.3
  min_reasoning_value: 0.1
  # Phase 11D-2 skill utility economics
  su_min: 0.0
  reuse_norm: 10
  tv_coverage_norm: 5
  base_maintenance: 0.05
  ntr_impact: 1.0
  default_cp: 0.3
  library_capacity: 50
  core_su: 0.6
  core_min_reuse: 3
  core_min_transfer: 0.5
  # Phase 11D-3 skill lifecycle
  growing_ug: 0.02
  dormant_after_tasks: 10
  core_growth_periods: 2
  retire_low_su_periods: 3
  retire_max_reuse: 1
  retire_max_ts: 0.1
  retire_min_age_tasks: 20
  decay_lambda: 0.01
  health_healthy: 0.75
  health_stable: 0.5
  health_weak: 0.25
  reactivate_min_evidence: 2
  reactivate_max_attempts: 2
  archive_after_tasks: 20
  # Phase 11D-4 sequential composition
  compose_max_skills: 3
  compose_max_candidates_per_task: 8
  compose_cost_base: 0.1
  cu_min: 0.0
  compose_min_successes_validate: 1
  compose_min_reuse_store: 2
  compose_min_reuse_promote: 3
  compose_min_confidence: 0.4
  compose_ncr_limit: 0.3
  compose_reject_identical: true
  compose_max_literal_triggers: 2

traces:
  min_steps: 1

mining:
  # Phase 11C-2 trace mining constraints
  min_frequency: 3
  min_cross_trace: 2
  max_fragment_length: 4
  min_core_length: 2
  successful_trace_bias: true

validation:
  # Phase 11C-3 ranking / promotion
  freq_norm: 10
  transfer_norm: 3
  min_f: 0.3
  min_c: 0.6
  min_g: 0.3
  min_t: 0.1
  min_r: 0.1
  min_invariant_score: 0.01
  transfer_rescue_min_t: 0.7
  transfer_rescue_min_frequency: 2

transfer:
  # Phase 11C-4 transfer-aware discovery / promotion gate
  min_transfer_attempts: 2
  min_its: 0.5
  ntr_limit: 0.3
  tu_reduction_norm: 1.0
  confidence_attempts_norm: 5

robustness:
  # Phase 11C-5 failure modes and hard gate
  min_vst: 0.6
  ier_warn: 1.0
  ier_restrict: 3.0
  min_evidence: 3
  min_tc: 0.5
  min_tfd: 0.3
  min_task_families_hard: 2
  min_compatibility: 0.5
  similarity_merge: 0.85
  saturation_k: 5
  difficulty_near: 0.25
  difficulty_moderate: 0.5
  difficulty_compositional: 0.75
  difficulty_structural: 1.0
  ntr_blacklist_violations: 2

skill_robustness:
  # Phase 11D-5 skill failure modes and robust gates
  ser_warn: 0.5
  ser_restrict: 0.8
  min_confidence_promote: 0.4
  min_evidence_promote: 3
  min_utility_promote: 0.0
  duplicate_similarity: 0.85
  ntr_warn: 0.2
  ntr_restrict: 0.3
  ntr_retire: 0.5
  rr_min: 0.6
  retrieval_boost: 0.2
  cu_min_composition: 0.0
  composition_ncr_limit: 0.3
  cgr_collapse: -0.05
  collapse_periods: 2
  tfd_min_promote: 0.2
  transfer_override_min: 0.7
  ancient_core_min_age: 50
  zombie_permanent_archive_attempts: 2
  cannibalization_ratio: 0.5
  audit_max_actions: 5
  library_capacity: 50

capability:
  # Phase 11E-1 capability representation
  min_skills: 1
  min_transfer_events: 1
  min_utility: 0.0
  min_confidence: 0.3
  min_coverage: 0.1
  ccov_family_norm: 5
  capu_w_su: 0.4
  capu_w_ts: 0.25
  capu_w_cov: 0.2
  capu_w_comp: 0.15
  strength_reuse_norm: 10
  core_min_strength: 0.6
  core_min_confidence: 0.5
  decline_ug: -0.02
  overlap_similarity: 0.85
  max_capabilities: 30
  monolith_skill_fraction: 0.8
  archive_low_utility_periods: 3

growth:
  # Phase 11E-2 capability growth measurement
  w_su: 0.4
  w_ts: 0.25
  w_cov: 0.2
  w_comp: 0.15
  ig_w_cgr: 0.35
  ig_w_tg: 0.25
  ig_w_ug: 0.2
  ig_w_ccg: 0.15
  ig_w_compg: 0.05
  skill_count_illusion_min_skills: 5
  skill_count_illusion_max_cgr: 0.01
  transfer_illusion_min_tg: 0.05
  transfer_illusion_max_utility_delta: 0.0
  coverage_inflation_min_ccg: 0.05
  coverage_inflation_max_transfer_delta: 0.0
  growth_without_utility_min_cgr: 0.02
  growth_without_utility_max_ug: 0.0
  metric_gaming_min_cgr: 0.05
  metric_gaming_max_evidence: 0
  saturation_low_csr: 0.05
  default_dt: 1.0

evaluation:
  # Phase 11E-4 evaluation harness
  default_dt: 1.0
  min_cgr_success: 0.01
  min_igr_success: 0.005
  max_ntr_success: 0.3
  min_reuse_success: 1
  ci_z: 1.96
  report_dir: reports/metrics
  default_level: capability
  experiences_per_step: 5
