<text x="194" y="657" fill="#173a59" font-family="Arial, sans-serif" font-size="17" font-weight="700">Upstream break in bounded representation / coverage</text>
<text x="194" y="682" fill="#405f7b" font-family="Arial, sans-serif" font-size="14">3/600 discovery demo fits in full 10-program scan → 0 invariants → skills/capabilities unavailable.</text>
