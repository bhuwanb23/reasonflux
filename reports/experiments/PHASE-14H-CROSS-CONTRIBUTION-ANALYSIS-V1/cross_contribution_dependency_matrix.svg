<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">ASFT Cross-Contribution Dependency Matrix</title>
<desc id="desc">The first three causal links have narrow synthetic operational support. Transfer to capability growth is the first unestablished link. Capability growth to intelligence growth is not validated. The ARC chain fails upstream at bounded representation and coverage.</desc>
<rect width="1200" height="760" fill="#f4f7fb"/>
<rect x="0" y="0" width="1200" height="126" fill="#10243a"/>
<text x="54" y="54" fill="#ffffff" font-family="Arial, sans-serif" font-size="30" font-weight="700">ASFT Cross-Contribution Dependency Matrix</text>
<text x="54" y="91" fill="#c8d7e7" font-family="Arial, sans-serif" font-size="16">Evidence-weighted status across saved Phase 13 synthetic and ARC evidence</text>

<text x="64" y="164" fill="#52677c" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1">LINK</text>
<text x="350" y="164" fill="#52677c" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1">EVIDENCE SNAPSHOT</text>
<text x="932" y="164" fill="#52677c" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1">ASSESSMENT</text>

